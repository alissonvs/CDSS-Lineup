services:
  # 1. Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: cdss-lineup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdsslineup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdsslineup_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cdsslineup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdsslineup} -d ${POSTGRES_DB:-cdsslineup}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Aplicação PCS Lineup (Backend + Frontend)
  cdss-lineup:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY}
    container_name: cdss-lineup-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-cdsslineup}:${POSTGRES_PASSWORD:-cdsslineup_secret}@postgres:5432/${POSTGRES_DB:-cdsslineup}}
      - DATADOCKED_API_KEY=${DATADOCKED_API_KEY}
      - VITE_CARTO_API_KEY=${VITE_CARTO_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
